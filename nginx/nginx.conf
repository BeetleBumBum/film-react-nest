server {
  listen 80;
  server_name beetle-film.nomorepartiessite.ru;
  return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name beetle-film.nomorepartiessite.ru;

    ssl_certificate /etc/letsencrypt/live/beetle-film.nomorepartiessite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beetle-film.nomorepartiessite.ru/privkey.pem;  

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location /content/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }
}